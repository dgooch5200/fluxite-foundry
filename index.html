<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Web-based Fluxite Codex format builder" />
    <title>Fluxite Foundry</title>
    <style>
      /*
       * Loading screen. It paints before any JS runs, so the app's .dark class
       * and theme tokens don't apply yet. Colors are literals matching
       * --background and --primary in src/index.css, and the theme follows the
       * OS instead of the saved theme setting.
       */
      .app-loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: oklch(1 0 0);
        color: oklch(0.606 0.25 292.717);
      }
      .app-loading svg {
        width: 160px;
        overflow: visible;
      }
      .app-loading-ring {
        opacity: 0.3;
      }
      .app-loading-head {
        stroke: oklch(0.52 0.27 293);
      }
      .app-loading-orbit path {
        animation: app-loading-orbit 1.6s linear infinite;
      }
      /* The hex path runs counterclockwise, so a growing offset moves the comet clockwise. */
      @keyframes app-loading-orbit {
        from {
          stroke-dashoffset: 0px;
        }
        to {
          stroke-dashoffset: 100px;
        }
      }
      @media (prefers-color-scheme: dark) {
        .app-loading {
          background: oklch(0.141 0.005 285.823);
          color: oklch(0.541 0.281 293.009);
        }
        .app-loading-ring {
          opacity: 0.4;
        }
        .app-loading-head {
          stroke: oklch(0.88 0.1 293);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loading-orbit {
          display: none;
        }
        .app-loading-ring {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- React replaces this on first render. The paths are copies of
           src/components/icons/AppLogoMark.svg. -->
      <div class="app-loading">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          role="img"
          aria-label="Fluxite Foundry"
        >
          <defs>
            <filter
              id="app-loading-glow"
              x="-30%"
              y="-30%"
              width="160%"
              height="160%"
            >
              <feGaussianBlur stdDeviation="0.55" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <path
            class="app-loading-ring"
            d="M20.5 15.8V8.2a1.91 1.91 0 0 0-.944-1.645l-6.612-3.8a1.88 1.88 0 0 0-1.888 0l-6.612 3.8A1.9 1.9 0 0 0 3.5 8.2v7.602a1.91 1.91 0 0 0 .944 1.644l6.612 3.8a1.88 1.88 0 0 0 1.888 0l6.612-3.8A1.9 1.9 0 0 0 20.5 15.8"
          />
          <!-- The comet is several dashes sharing a leading edge, each longer and
               fainter than the last. Lengths are percent of the ring. -->
          <g class="app-loading-orbit" filter="url(#app-loading-glow)">
            <path
              pathLength="100"
              stroke-dasharray="36 64"
              opacity="0.07"
              d="M20.5 15.8V8.2a1.91 1.91 0 0 0-.944-1.645l-6.612-3.8a1.88 1.88 0 0 0-1.888 0l-6.612 3.8A1.9 1.9 0 0 0 3.5 8.2v7.602a1.91 1.91 0 0 0 .944 1.644l6.612 3.8a1.88 1.88 0 0 0 1.888 0l6.612-3.8A1.9 1.9 0 0 0 20.5 15.8"
            />
            <path
              pathLength="100"
              stroke-dasharray="26 74"
              opacity="0.12"
              d="M20.5 15.8V8.2a1.91 1.91 0 0 0-.944-1.645l-6.612-3.8a1.88 1.88 0 0 0-1.888 0l-6.612 3.8A1.9 1.9 0 0 0 3.5 8.2v7.602a1.91 1.91 0 0 0 .944 1.644l6.612 3.8a1.88 1.88 0 0 0 1.888 0l6.612-3.8A1.9 1.9 0 0 0 20.5 15.8"
            />
            <path
              pathLength="100"
              stroke-dasharray="18 82"
              opacity="0.2"
              d="M20.5 15.8V8.2a1.91 1.91 0 0 0-.944-1.645l-6.612-3.8a1.88 1.88 0 0 0-1.888 0l-6.612 3.8A1.9 1.9 0 0 0 3.5 8.2v7.602a1.91 1.91 0 0 0 .944 1.644l6.612 3.8a1.88 1.88 0 0 0 1.888 0l6.612-3.8A1.9 1.9 0 0 0 20.5 15.8"
            />
            <path
              pathLength="100"
              stroke-dasharray="12 88"
              opacity="0.32"
              d="M20.5 15.8V8.2a1.91 1.91 0 0 0-.944-1.645l-6.612-3.8a1.88 1.88 0 0 0-1.888 0l-6.612 3.8A1.9 1.9 0 0 0 3.5 8.2v7.602a1.91 1.91 0 0 0 .944 1.644l6.612 3.8a1.88 1.88 0 0 0 1.888 0l6.612-3.8A1.9 1.9 0 0 0 20.5 15.8"
            />
            <path
              pathLength="100"
              stroke-dasharray="7 93"
              opacity="0.5"
              d="M20.5 15.8V8.2a1.91 1.91 0 0 0-.944-1.645l-6.612-3.8a1.88 1.88 0 0 0-1.888 0l-6.612 3.8A1.9 1.9 0 0 0 3.5 8.2v7.602a1.91 1.91 0 0 0 .944 1.644l6.612 3.8a1.88 1.88 0 0 0 1.888 0l6.612-3.8A1.9 1.9 0 0 0 20.5 15.8"
            />
            <path
              class="app-loading-head"
              pathLength="100"
              stroke-width="1.9"
              stroke-dasharray="3 97"
              d="M20.5 15.8V8.2a1.91 1.91 0 0 0-.944-1.645l-6.612-3.8a1.88 1.88 0 0 0-1.888 0l-6.612 3.8A1.9 1.9 0 0 0 3.5 8.2v7.602a1.91 1.91 0 0 0 .944 1.644l6.612 3.8a1.88 1.88 0 0 0 1.888 0l6.612-3.8A1.9 1.9 0 0 0 20.5 15.8"
            />
          </g>
          <path d="M14 12a2 2 0 1 1-4 0m4 0a2 2 0 1 0-4 0m4 0h3m-7 0H7" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
